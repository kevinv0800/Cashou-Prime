<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oracle Omni V19 - Elite Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #030303; 
            --surface: #121212; 
            --surface-glass: rgba(20, 20, 20, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6; 
            --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #06b6d4;
            --success: #10b981; 
            --danger: #ef4444;
            --text: #ffffff; 
            --text-dim: #9ca3af;
            --gradient-btn: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: 90px; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
        }

        /* --- UTILITÁRIOS --- */
        .mono { font-family: 'JetBrains Mono', monospace; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
        
        /* --- ANIMAÇÕES --- */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 5px var(--primary-glow); } 50% { box-shadow: 0 0 20px var(--primary-glow); } 100% { box-shadow: 0 0 5px var(--primary-glow); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- SPLASH SCREEN --- */
        #splash { position: fixed; inset: 0; background: #000; z-index: 9999; flex-direction: column; }
        .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s infinite linear; }

        /* --- LOGIN --- */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 5000; padding: 20px; }
        .auth-bg-orb { position: absolute; width: 300px; height: 300px; background: var(--primary); filter: blur(120px); opacity: 0.2; border-radius: 50%; top: -50px; left: -50px; }
        .auth-card { 
            position: relative; z-index: 10; width: 100%; max-width: 380px; 
            background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-group { position: relative; margin-bottom: 16px; }
        .custom-input { 
            width: 100%; background: #0a0a0a; border: 1px solid var(--border); 
            color: #fff; padding: 16px; border-radius: 14px; font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .custom-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1); }
        
        /* --- BOTÕES --- */
        .btn { 
            width: 100%; padding: 16px; border: none; border-radius: 14px; 
            font-weight: 700; font-size: 0.95rem; cursor: pointer; color: #fff;
            transition: transform 0.1s; position: relative; overflow: hidden;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--gradient-btn); box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
        .btn-wa { background: #25D366; color: #000; font-weight: 800; font-size: 0.75rem; padding: 8px 16px; border-radius: 50px; text-decoration: none; display: flex; align-items: center; gap: 6px; }

        /* --- HEADER & NAV --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px; }
        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        
        .navbar { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 20px; 
            display: flex; justify-content: space-around; padding: 14px 0; 
            z-index: 4000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item { color: #555; font-size: 1.3rem; position: relative; transition: color 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--text); }
        .nav-item.active::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--primary); border-radius: 50%; }

        /* --- CARDS & WIDGETS --- */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; position: relative; overflow: hidden; }
        
        /* Match Select */
        .match-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; }
        .team-box { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .flag-circle { 
            width: 64px; height: 64px; border-radius: 50%; background: #1a1a1a; 
            border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 800; color: #444; overflow: hidden;
            transition: border-color 0.3s;
        }
        .flag-circle img { width: 100%; height: 100%; object-fit: cover; }
        .flag-circle.active { border-color: var(--primary); color: #fff; background: var(--primary-glow); }
        .vs-badge { font-weight: 900; color: #333; font-style: italic; font-size: 1.2rem; }
        .team-input { 
            width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--border);
            color: #fff; text-align: center; font-weight: 600; padding: 5px; text-transform: uppercase;
            font-size: 0.85rem;
        }
        .team-input:focus { border-color: var(--primary); }

        /* Results */
        .result-card { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--primary); background: linear-gradient(180deg, rgba(124, 58, 237, 0.05) 0%, rgba(0,0,0,0) 100%); }
        .stat-row { margin-bottom: 12px; }
        .stat-header { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
        .progress-bg { height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 1s ease-out; }
        
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
        .stat-lbl { font-size: 0.6rem; text-transform: uppercase; color: #666; font-weight: 700; margin-top: 4px; }

        /* Chat */
        .chat-container { height: calc(100vh - 200px); display: flex; flex-direction: column; }
        .chat-area { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; position: relative; animation: slideUp 0.3s ease; }
        .msg-me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-start; background: #1e1e1e; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg-user { font-size: 0.65rem; opacity: 0.6; margin-bottom: 4px; display: block; font-weight: 600; }
        
        /* Modal */
        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9000; backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: #181818; border: 1px solid #333; padding: 30px; border-radius: 24px; text-align: center; max-width: 320px; width: 100%; animation: float 6s infinite ease-in-out; }

    </style>
</head>
<body>

<div id="splash" class="flex-center">
    <div class="loader"></div>
    <div style="margin-top:20px; font-weight:800; letter-spacing: 2px; font-size:0.8rem;">INITIALIZING V19...</div>
</div>

<div id="modal-overlay">
    <div class="modal-box">
        <i class="fas fa-shield-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
        <h3 id="modal-title" style="margin: 0 0 10px 0;">ATENÇÃO</h3>
        <p id="modal-msg" style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 25px;">Mensagem aqui.</p>
        <button class="btn btn-outline" onclick="closeModal()">ENTENDIDO</button>
    </div>
</div>

<div id="auth-screen" class="flex-center hidden">
    <div class="auth-bg-orb"></div>
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="margin: 0; font-size: 2rem;">ORACLE</h1>
            <p style="margin: 5px 0 0 0; color: var(--primary); font-weight: 600; letter-spacing: 3px; font-size: 0.8rem;">MASTER EDITION</p>
        </div>
        
        <div class="input-group">
            <input type="text" id="login-user" class="custom-input" placeholder="Usuário">
            <i class="fas fa-user" style="position: absolute; right: 15px; top: 18px; color: #444;"></i>
        </div>
        <div class="input-group">
            <input type="password" id="login-pass" class="custom-input" placeholder="Senha">
            <i class="fas fa-eye" onclick="togglePass()" style="position: absolute; right: 15px; top: 18px; color: #444; cursor: pointer;"></i>
        </div>

        <button class="btn btn-primary" onclick="auth('login')">ACESSAR SISTEMA</button>
        
        <div style="text-align: center; margin-top: 20px;">
            <span style="font-size: 0.8rem; color: #666; cursor: pointer;" onclick="auth('register')">Não tem acesso? <b>Criar conta</b></span>
        </div>
    </div>
</div>

<div id="app" class="hidden">
    <header>
        <div class="logo">ORACLE<span>.AI</span></div>
        <a href="#" class="btn-wa"><i class="fab fa-whatsapp"></i> VIP</a>
    </header>

    <div style="padding: 0 20px;">
        
        <div id="view-home" class="view-section">
            <div class="card">
                <div class="match-grid">
                    <div class="team-box">
                        <div class="flag-circle" id="flag-h">H</div>
                        <input class="team-input" id="input-h" placeholder="CASA" oninput="updateFlag('h')">
                    </div>
                    <div class="vs-badge">VS</div>
                    <div class="team-box">
                        <div class="flag-circle" id="flag-a">A</div>
                        <input class="team-input" id="input-a" placeholder="FORA" oninput="updateFlag('a')">
                    </div>
                </div>
                <button class="btn btn-primary" id="btn-generate" onclick="generateSignal()" style="margin-top: 25px;">
                    <i class="fas fa-bolt"></i> GERAR INTELIGÊNCIA
                </button>
            </div>

            <div id="result-area" style="display: none;"></div>
        </div>

        <div id="view-chat" class="view-section hidden">
            <div class="card chat-container" style="padding: 0; background: #050505;">
                <div class="chat-area" id="chat-feed">
                    </div>
                <div style="padding: 15px; background: #121212; border-top: 1px solid #222; display: flex; gap: 10px;">
                    <input id="chat-input" type="text" style="flex: 1; background: #222; border: none; padding: 12px; border-radius: 20px; color: #fff;" placeholder="Digite algo...">
                    <button onclick="sendMsg()" style="width: 45px; height: 45px; border-radius: 50%; border: none; background: var(--primary); color: #fff;"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="view-history" class="view-section hidden">
            <h3 style="margin: 0 0 15px 5px; font-size: 1.1rem;">Últimas Análises</h3>
            <div id="history-list"></div>
        </div>

        <div id="view-profile" class="view-section hidden">
            <div class="card" style="text-align: center; padding: 40px 20px;">
                <div style="width: 80px; height: 80px; background: var(--primary); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800;" id="profile-initial">U</div>
                <h2 id="profile-name" style="margin: 0;">Usuário</h2>
                <p style="color: var(--text-dim); font-size: 0.8rem;">Membro desde 2024</p>
                <div style="margin-top: 30px; display: grid; gap: 10px;">
                    <button class="btn btn-outline" onclick="logout()" style="border-color: var(--danger); color: var(--danger);">SAIR DA CONTA</button>
                </div>
            </div>
        </div>

    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="nav('home')"><i class="fas fa-home"></i></div>
        <div class="nav-item" onclick="nav('chat')"><i class="fas fa-comment-alt"></i></div>
        <div class="nav-item" onclick="nav('history')"><i class="fas fa-history"></i></div>
        <div class="nav-item" onclick="nav('profile')"><i class="fas fa-user"></i></div>
    </div>
</div>

<script>
    // --- DADOS & CONFIG ---
    const DB_LOGOS = {
        "flamengo": "https://upload.wikimedia.org/wikipedia/commons/2/2e/Flamengo_braz_logo.svg",
        "palmeiras": "https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg",
        "corinthians": "https://upload.wikimedia.org/wikipedia/pt/b/b4/Corinthians_simbolo.png",
        "sao paulo": "https://upload.wikimedia.org/wikipedia/commons/6/6f/Brasao_do_Sao_Paulo_Futebol_Clube.svg",
        "real madrid": "https://upload.wikimedia.org/wikipedia/pt/9/98/Real_Madrid.png",
        "barcelona": "https://upload.wikimedia.org/wikipedia/pt/4/43/FCBarcelona.svg",
        "city": "https://upload.wikimedia.org/wikipedia/pt/0/02/Manchester_City_Football_Club.png",
        "liverpool": "https://upload.wikimedia.org/wikipedia/pt/thumb/0/0c/Liverpool_FC.svg/1200px-Liverpool_FC.svg.png",
        "psg": "https://upload.wikimedia.org/wikipedia/pt/a/a7/Paris_Saint-Germain_F.C..png",
        "bayern": "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg"
    };

    let currentUser = localStorage.getItem('oracle_user');
    let fakeChatInterval;

    // --- INICIALIZAÇÃO ---
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            if(currentUser) {
                initApp();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('auth-screen').style.display = 'flex';
            }
        }, 1500);
    };

    // --- AUTENTICAÇÃO ---
    function auth(action) {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();

        if(!u || !p) return showModal("Campos vazios", "Por favor, preencha usuário e senha.");

        if(action === 'register') {
            if(localStorage.getItem('user_' + u)) return showModal("Erro", "Usuário já existe.");
            localStorage.setItem('user_' + u, p);
            showModal("Sucesso", "Conta criada! Faça login.");
        } else {
            if(localStorage.getItem('user_' + u) === p) {
                localStorage.setItem('oracle_user', u);
                location.reload();
            } else {
                showModal("Erro", "Credenciais inválidas.");
            }
        }
    }

    function logout() {
        localStorage.removeItem('oracle_user');
        location.reload();
    }

    function initApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');
        
        document.getElementById('profile-name').innerText = currentUser.toUpperCase();
        document.getElementById('profile-initial').innerText = currentUser[0].toUpperCase();
        
        loadHistory();
        loadChat();
        startFakeChat();
    }

    // --- NAVEGAÇÃO ---
    function nav(view) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
        document.getElementById('view-' + view).classList.remove('hidden');
        
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');

        if(view === 'history') loadHistory();
    }

    // --- LÓGICA DE IMAGENS ---
    function updateFlag(side) {
        const input = document.getElementById(`input-${side}`);
        const circle = document.getElementById(`flag-${side}`);
        const val = input.value.toLowerCase().trim();

        let found = false;
        // Busca simples por substring
        for(let key in DB_LOGOS) {
            if(val.length > 2 && key.includes(val)) {
                circle.innerHTML = `<img src="${DB_LOGOS[key]}">`;
                circle.classList.add('active');
                found = true;
                break;
            }
        }

        if(!found) {
            circle.innerHTML = val.length > 0 ? val.substring(0, 2).toUpperCase() : (side === 'h' ? 'H' : 'A');
            circle.classList.remove('active');
            if(val.length > 0) circle.style.borderColor = 'var(--text-dim)';
        }
    }

    // --- GERADOR DE SINAIS (CORE) ---
    function generateSignal() {
        const h = document.getElementById('input-h').value.toUpperCase();
        const a = document.getElementById('input-a').value.toUpperCase();

        if(h.length < 2 || a.length < 2) return showModal("Dados Insuficientes", "Preencha os nomes dos times.");

        // Bloqueio de duplicidade
        const last = JSON.parse(localStorage.getItem('oracle_last_match') || '{}');
        if(last.match === `${h} vs ${a}` && (Date.now() - last.time) < 60000) {
            return showModal("Aguarde", "Análise recente já realizada para este confronto.");
        }

        const btn = document.getElementById('btn-generate');
        const resArea = document.getElementById('result-area');
        
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> ANALISANDO DADOS...`;
        resArea.style.display = 'none';

        // Algoritmo Simulado
        setTimeout(() => {
            const probH = Math.floor(Math.random() * 45) + 30;
            const probA = Math.floor(Math.random() * (90 - probH));
            const probD = 100 - probH - probA;
            
            const goals = (Math.random() * 2.5 + 0.5).toFixed(1);
            const corners = Math.floor(Math.random() * 5) + 7;
            const confidence = Math.floor(Math.random() * 15) + 80;

            const isHome = probH > probA;
            const winner = isHome ? h : a;
            const color = isHome ? 'var(--success)' : 'var(--primary)';

            const html = `
                <div class="card result-card">
                    <div style="text-align:center; margin-bottom:15px;">
                        <span style="background:rgba(0,0,0,0.3); padding:4px 10px; border-radius:10px; font-size:0.7rem; color:var(--success); border:1px solid var(--success);">
                            <i class="fas fa-check-circle"></i> PADRÃO IDENTIFICADO
                        </span>
                    </div>

                    <div class="stat-row">
                        <div class="stat-header"><span>VITÓRIA ${h}</span><span class="mono">${probH}%</span></div>
                        <div class="progress-bg"><div class="progress-fill" style="width:${probH}%; background:${isHome ? 'var(--success)' : '#333'}"></div></div>
                    </div>
                     <div class="stat-row">
                        <div class="stat-header"><span>EMPATE</span><span class="mono">${probD}%</span></div>
                        <div class="progress-bg"><div class="progress-fill" style="width:${probD}%; background:#444"></div></div>
                    </div>
                     <div class="stat-row">
                        <div class="stat-header"><span>VITÓRIA ${a}</span><span class="mono">${probA}%</span></div>
                        <div class="progress-bg"><div class="progress-fill" style="width:${probA}%; background:${!isHome ? 'var(--primary)' : '#333'}"></div></div>
                    </div>

                    <div class="grid-stats">
                        <div class="stat-box">
                            <div class="stat-val mono" style="color:${color}">+${goals}</div>
                            <div class="stat-lbl">Gols Esperados</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-val mono">+${corners}</div>
                            <div class="stat-lbl">Escanteios</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-val mono">SIM</div>
                            <div class="stat-lbl">Ambos Marcam</div>
                        </div>
                        <div class="stat-box" style="border-color:var(--success)">
                            <div class="stat-val mono" style="color:var(--success)">${confidence}%</div>
                            <div class="stat-lbl">Confiança</div>
                        </div>
                    </div>

                    <button class="btn btn-outline" onclick="copySignal('${h}', '${a}', '+${goals}')" style="margin-top:15px; border-style:dashed;">
                        <i class="far fa-copy"></i> COPIAR SINAL
                    </button>
                </div>
            `;

            resArea.innerHTML = html;
            resArea.style.display = 'block';
            
            // Salvar Histórico
            saveToHistory(`${h} vs ${a}`, `${probH}% / ${probA}%`);
            localStorage.setItem('oracle_last_match', JSON.stringify({match: `${h} vs ${a}`, time: Date.now()}));

            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-bolt"></i> GERAR NOVA INTELIGÊNCIA`;

        }, 2000);
    }

    function copySignal(h, a, g) {
        const text = `🔮 *ORACLE V19 PREDICT* 🔮\n\n⚽ ${h} x ${a}\n📊 Gols: ${g}\n✅ Confiança: ALTA\n\nLink: oracle-ai.app`;
        navigator.clipboard.writeText(text);
        showModal("Copiado!", "Sinal copiado para a área de transferência.");
    }

    // --- HISTÓRICO ---
    function saveToHistory(match, result) {
        let hist = JSON.parse(localStorage.getItem('oracle_hist_' + currentUser) || '[]');
        hist.unshift({ m: match, r: result, t: new Date().toLocaleTimeString() });
        if(hist.length > 20) hist.pop();
        localStorage.setItem('oracle_hist_' + currentUser, JSON.stringify(hist));
    }

    function loadHistory() {
        const list = document.getElementById('history-list');
        const hist = JSON.parse(localStorage.getItem('oracle_hist_' + currentUser) || '[]');
        
        if(hist.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:20px; color:#444;">Nenhuma análise salva.</div>`;
            return;
        }

        list.innerHTML = hist.map(item => `
            <div class="card" style="padding:15px; border-left: 4px solid var(--primary); margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-weight:700; font-size:0.9rem;">${item.m}</div>
                    <div class="mono" style="color:var(--accent); font-size:0.8rem;">${item.r}</div>
                </div>
                <div style="font-size:0.7rem; color:#555; margin-top:5px;">${item.t}</div>
            </div>
        `).join('');
    }

    // --- CHAT SYSTEM (Fake Live) ---
    function loadChat() {
        const feed = document.getElementById('chat-feed');
        // Carrega mensagens salvas ou iniciais
        let msgs = JSON.parse(localStorage.getItem('oracle_chat_global') || '[]');
        if(msgs.length === 0) {
            msgs = [
                {u: 'Admin', m: 'Bem-vindos à versão V19 Elite! 🚀', me: false},
                {u: 'PedroHB', m: 'A assertividade hoje tá insana!', me: false}
            ];
        }
        renderChat(msgs);
    }

    function renderChat(msgs) {
        const feed = document.getElementById('chat-feed');
        feed.innerHTML = msgs.map(msg => `
            <div class="msg ${msg.me ? 'msg-me' : 'msg-other'}">
                ${!msg.me ? `<span class="msg-user" style="color:${getColor(msg.u)}">${msg.u}</span>` : ''}
                ${msg.m}
            </div>
        `).join('');
        feed.scrollTop = feed.scrollHeight;
    }

    function sendMsg() {
        const input = document.getElementById('chat-input');
        const txt = input.value.trim();
        if(!txt) return;

        addMsgToChat(currentUser, txt, true);
        input.value = '';
    }

    function addMsgToChat(user, text, isMe) {
        let msgs = JSON.parse(localStorage.getItem('oracle_chat_global') || '[]');
        const newMsg = {u: user, m: text, me: isMe};
        msgs.push(newMsg);
        if(msgs.length > 50) msgs.shift();
        localStorage.setItem('oracle_chat_global', JSON.stringify(msgs));
        
        // Renderiza apenas a nova (ou re-renderiza tudo para simplificar)
        renderChat(msgs);
    }

    function startFakeChat() {
        const fakeUsers = ['CarlosBet', 'AnaTrader', 'Lucas_Vip', 'MarcosWin', 'FelipeTips'];
        const fakeMsgs = [
            'Green no Real Madrid!', 'Alguém pegou esse sinal?', 'V19 tá muito assertiva hoje', 'Pagou dmais!', 'Bora pra próxima', 'Meta batida por hoje ✅'
        ];

        fakeChatInterval = setInterval(() => {
            if(Math.random() > 0.7) { // 30% de chance de mensagem a cada 5s
                const u = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
                const m = fakeMsgs[Math.floor(Math.random() * fakeMsgs.length)];
                addMsgToChat(u, m, false);
            }
        }, 5000);
    }

    function getColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
        return '#' + "00000".substring(0, 6 - c.length) + c;
    }

    // --- UTILITÁRIOS GERAIS ---
    function togglePass() {
        const x = document.getElementById('login-pass');
        x.type = x.type === "password" ? "text" : "password";
    }

    function showModal(title, msg) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

</script>
