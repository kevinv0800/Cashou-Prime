<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cashout Prime</title>
    <style>
        :root { 
            --primary: #00ff00; 
            --secondary: #ff3b3b; 
            --bg-gradient: radial-gradient(circle at top, #0a3d26, #000);
            --glass: rgba(0, 0, 0, 0.94);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; 
            background: #000; font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden; color: white;
        }

        /* ANIMAÇÕES PERSONALIZADAS */
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 5px var(--primary); } 50% { box-shadow: 0 0 20px var(--primary); } }

        /* SPLASH */
        #splash {
            position: fixed; inset: 0; z-index: 50000;
            background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        /* TELAS UNIVERSAIS */
        .screen { 
            position: fixed; inset: 0; z-index: 10000; 
            background: var(--bg-gradient);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }

        .card { 
            background: var(--glass); padding: 30px; border-radius: 25px; 
            border: 1px solid rgba(0, 255, 0, 0.3); width: 100%; max-width: 380px; 
            text-align: center; backdrop-filter: blur(20px);
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* DIÁLOGOS PERSONALIZADOS (MODAIS) */
        .custom-dialog {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 60000; display: none; align-items: center; justify-content: center; padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        input, select { 
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; 
            border: 1px solid #1a4d35; background: #05140d; color: white; font-size: 16px; outline: none;
        }

        .btn-go { 
            background: var(--primary); color: #000; padding: 16px; border: none; 
            border-radius: 12px; width: 100%; font-weight: 900; cursor: pointer; 
            margin-top: 10px; text-transform: uppercase; transition: 0.3s;
        }

        /* PERFIL INFO */
        .user-info {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;
            margin-bottom: 20px; text-align: left; border-left: 4px solid var(--primary);
        }

        /* INTERFACE FLUTUANTE */
        #site-wrapper { position: absolute; inset: 0; z-index: 1; display: none; }
        iframe { width: 100%; height: 100%; border: none; }

        #float-btn { 
            position: fixed; bottom: 30px; right: 20px; width: 65px; height: 65px; 
            background: var(--primary); border-radius: 50%; display: none; 
            align-items: center; justify-content: center; z-index: 15000; 
            border: 3px solid white; animation: pulseGlow 2s infinite; cursor: pointer;
        }

        #signal-card { 
            position: fixed; bottom: 105px; right: 20px; left: 20px; width: auto; max-width: 380px; margin-left: auto;
            background: var(--glass); border: 2px solid var(--primary); border-radius: 20px; 
            padding: 15px; display: none; z-index: 14000; animation: slideUp 0.4s ease;
        }

        .box { border: 1px solid var(--primary); border-radius: 10px; padding: 10px 5px; flex: 1; text-align: center; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.5); }
        .box span { display: block; font-size: 9px; color: #888; margin-bottom: 4px; }
    </style>
</head>
<body>

<audio id="signal-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<div id="my-alert" class="custom-dialog">
    <div class="card" style="border-color: var(--secondary);">
        <h3 id="alert-title" style="color:var(--secondary)">AVISO</h3>
        <p id="alert-msg" style="margin: 20px 0;"></p>
        <button class="btn-go" onclick="closeAlert()">OK</button>
    </div>
</div>

<div id="splash">
    <div style="color:var(--primary); font-weight:bold; letter-spacing:8px; font-size:26px;">CASHOUT PRIME</div>
    <p style="font-size: 10px; margin-top: 10px; color: #444;">CARREGANDO SISTEMA...</p>
</div>

<div id="login-screen" class="screen">
    <div class="card">
        <h2 style="color:var(--primary)">Acesso</h2>
        <input type="text" id="u" placeholder="Usuário">
        <input type="password" id="p" placeholder="Senha">
        <button class="btn-go" onclick="auth()">ENTRAR</button>
        <p style="font-size: 11px; margin-top: 25px; color: #333; cursor:pointer;" onclick="setS('adm-auth-screen')">PAINEL ADMINISTRATIVO</p>
    </div>
</div>

<div id="adm-auth-screen" class="screen">
    <div class="card">
        <h2 style="color:var(--primary)">ADM LOGIN</h2>
        <input type="password" id="adm-key" placeholder="Senha Mestra">
        <button class="btn-go" onclick="checkAdm()">VERIFICAR</button>
        <button class="btn-go" style="background:transparent; color:white; border:1px solid #222;" onclick="setS('login-screen')">VOLTAR</button>
    </div>
</div>

<div id="status-screen" class="screen">
    <div class="card">
        <h2 style="color:var(--primary)">PERFIL</h2>
        <div class="user-info">
            <div style="font-size: 10px; color: var(--primary);">OPERADOR ATIVO</div>
            <div id="display-user" style="font-size: 20px; font-weight: 900; margin-bottom: 10px;">---</div>
            <div style="font-size: 10px; color: var(--secondary);">TEMPO DE LICENÇA</div>
            <div id="timer-countdown" style="font-size: 18px; font-weight: 800; color: #fff;">00:00:00</div>
        </div>
        <button class="btn-go" onclick="go('https://888bets.co.ao/')">888BET</button>
        <button class="btn-go" onclick="go('https://elephantbet.co.ao/')">ELEPHANT BET</button>
        <button class="btn-go" onclick="go('https://m.bantubet.co.ao/')">BANTUBET</button>
        <p style="margin-top:15px; font-size:12px; color:#444; cursor:pointer;" onclick="location.reload()">SAIR DA CONTA</p>
    </div>
</div>

<div id="admin-screen" class="screen">
    <div class="card">
        <h2 style="color:var(--primary)">CADASTRO</h2>
        <input type="text" id="new-u" placeholder="Novo Usuário">
        <input type="password" id="new-p" placeholder="Nova Senha">
        <select id="new-time">
            <option value="60">1 MINUTO (TESTE)</option>
            <option value="86400">24 HORAS</option>
            <option value="604800">7 DIAS</option>
            <option value="2592000">30 DIAS</option>
        </select>
        <button class="btn-go" onclick="add()">GERAR ACESSO</button>
        <div id="list" style="margin-top:15px; max-height:120px; overflow-y:auto; background:rgba(0,0,0,0.3); border-radius: 10px; text-align: left;"></div>
        <button class="btn-go" style="background:transparent; color:white; border:1px solid #444;" onclick="setS('login-screen')">VOLTAR</button>
    </div>
</div>

<div id="site-wrapper">
    <iframe id="frame"></iframe>
    <div id="float-btn" onclick="toggle()">
        <img src="https://img.icons8.com/color/48/000000/robot-2.png" width="40"/>
    </div>
    <div id="signal-card">
        <div style="display: flex; gap: 8px;">
            <div class="box"><span>PRÓXIMO</span><div id="v-time">--:--</div></div>
            <div class="box"><span>SAÍDA</span><div id="v-odds" style="color:#fbff00;">...</div></div>
            <div class="box"><span>PROTEÇÃO</span><div id="v-prot">...</div></div>
        </div>
        <div style="font-size: 10px; color: #555; text-align: center; margin-top: 10px;" id="clock-real">00:00:00</div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('cp_users')) || [];
    let activeUser = null;
    let countdownInterval = null;

    // Splash e Inicialização
    window.onload = () => setTimeout(() => { 
        document.getElementById('splash').style.display='none'; 
        setS('login-screen');
    }, 2500);

    // Diálogos Personalizados
    function showMyAlert(title, msg) {
        document.getElementById('alert-title').innerText = title;
        document.getElementById('alert-msg').innerText = msg;
        document.getElementById('my-alert').style.display = 'flex';
    }
    function closeAlert() { document.getElementById('my-alert').style.display = 'none'; }

    function auth() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        const user = db.find(x => x.u === u && x.p === p);
        
        if(user) {
            if(user.expiry < Date.now()) {
                showMyAlert("BLOQUEADO", "Sua licença expirou! Contacte o administrador.");
                return;
            }
            activeUser = user;
            document.getElementById('display-user').innerText = user.u;
            startCountdown();
            setS('status-screen');
        } else { 
            showMyAlert("ERRO", "Usuário ou Senha incorretos.");
        }
    }

    function checkAdm() {
        if(document.getElementById('adm-key').value === "0zZ") {
            setS('admin-screen');
            refresh();
        } else {
            showMyAlert("NEGADO", "Chave administrativa inválida.");
        }
    }

    function startCountdown() {
        if(countdownInterval) clearInterval(countdownInterval);
        const updateTimer = () => {
            const diff = activeUser.expiry - Date.now();
            if(diff <= 0) {
                clearInterval(countdownInterval);
                location.reload();
                return;
            }
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('timer-countdown').innerText = `${h}:${m}:${s}`;
        };
        updateTimer();
        countdownInterval = setInterval(updateTimer, 1000);
    }

    function add() {
        const u = document.getElementById('new-u').value;
        const p = document.getElementById('new-p').value;
        const sec = parseInt(document.getElementById('new-time').value);
        if(u && p) {
            db.push({ u, p, expiry: Date.now() + (sec * 1000) });
            localStorage.setItem('cp_users', JSON.stringify(db));
            refresh();
            showMyAlert("SUCESSO", "Usuário criado com sucesso!");
        }
    }

    function refresh() {
        document.getElementById('list').innerHTML = db.map((x,i) => `
            <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #111; font-size:11px;">
                <span>${x.u}</span><span onclick="del(${i})" style="color:red; font-weight:bold;">REMOVER</span>
            </div>`).join('');
    }
    function del(i) { db.splice(i,1); localStorage.setItem('cp_users', JSON.stringify(db)); refresh(); }

    function setS(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display='none');
        if(id !== 'none') document.getElementById(id).style.display='flex';
    }

    function go(url) {
        setS('none');
        document.getElementById('site-wrapper').style.display='block';
        document.getElementById('float-btn').style.display='flex';
        document.getElementById('frame').src = url;
        startIA();
    }

    function toggle() {
        const c = document.getElementById('signal-card');
        c.style.display = (c.style.display === 'block') ? 'none' : 'block';
    }

    function startIA() {
        const sound = document.getElementById('signal-sound');
        const update = () => {
            const tr = new Date();
            let nextM = tr.getMinutes() + 1;
            let nextH = tr.getHours();
            if(nextM >= 60) { nextM = 0; nextH = (nextH+1 >= 24) ? 0 : nextH+1; }

            const out = (Math.random() * (2.6 - 1.4) + 1.4).toFixed(2);
            const p1 = Math.floor(Math.random() * 2) + 1;
            const p2 = Math.floor(Math.random() * 9);

            document.getElementById('v-time').innerText = `${nextH}:${nextM.toString().padStart(2, '0')} ➔`;
            document.getElementById('v-odds').innerText = `${out}X`;
            document.getElementById('v-prot').innerText = `${p1}.${p2}0X`;
            sound.play().catch(() => {});
        };
        setInterval(() => { document.getElementById('clock-real').innerText = new Date().toLocaleTimeString(); }, 1000);
        update();
        setInterval(update, 90000); 
    }
</script>
</body>
</html>
